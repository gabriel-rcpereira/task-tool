services:
  postgres:
    image: postgres:17-alpine
    container_name: task-tool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_tool
      POSTGRES_USER: task_tool
      POSTGRES_PASSWORD: task_tool
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_tool -d task_tool"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
