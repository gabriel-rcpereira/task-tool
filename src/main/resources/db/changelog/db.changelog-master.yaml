databaseChangeLog:
  - changeSet:
      id: 2026-07-28-01-create-task-table
      author: codex
      changes:
        - createTable:
            tableName: task
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: due_date_at
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(32)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
